<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="18" fill="#f3f5f7"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#172a3a"><text x="35" y="45" font-size="25" font-weight="700">A4Stitch · 两张 A4，拼出 A3 展开效果</text><text x="35" y="80" font-size="17">PDF 页序：1 → 4 → 2 → 3 ｜ A4 竖向 · 双面长边翻转</text><text x="35" y="125" font-size="19">两张 A4 的正反面</text><g fill="#fff" stroke="#9caebd" stroke-width="2"><rect x="35" y="145" width="100" height="140" rx="4"/><rect x="150" y="145" width="100" height="140" rx="4"/><rect x="275" y="145" width="100" height="140" rx="4"/><rect x="390" y="145" width="100" height="140" rx="4"/></g><g text-anchor="middle"><g font-size="42" font-weight="700"><text x="85" y="220">1</text><text x="200" y="220">4</text><text x="325" y="220">2</text><text x="440" y="220">3</text></g><g font-size="15"><text x="85" y="265">纸 1 正面</text><text x="200" y="265">纸 1 背面</text><text x="325" y="265">纸 2 正面</text><text x="440" y="265">纸 2 背面</text></g></g><text x="520" y="220" font-size="32">→</text><text x="585" y="125" font-size="19">拼接正面 1｜2</text><text x="790" y="125" font-size="19">翻面 3｜4</text><g fill="#fff" stroke="#377eb0" stroke-width="2"><rect x="580" y="145" width="180" height="140" rx="4"/><rect x="790" y="145" width="180" height="140" rx="4"/></g><g stroke="#377eb0" stroke-width="2" stroke-dasharray="5 4"><path d="M670 145V285"/><path d="M880 145V285"/></g><g font-size="40" font-weight="700" text-anchor="middle"><text x="625" y="230">1</text><text x="715" y="230">2</text><text x="835" y="230">3</text><text x="925" y="230">4</text></g><text x="35" y="340" font-size="19">一套四页试卷 = 两张 A4 纸；完成打印后，将正面按 1｜2 左右拼接。</text><text x="35" y="382" font-size="17">默认输出仍是 A4 PDF，适合普通 A4 双面打印机。</text></g></svg>